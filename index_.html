<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Android UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden !important; overscroll-behavior: none;
    }
    body {
      position: fixed; inset: 0;
      background: #111; display: flex; justify-content: center; align-items: stretch;
      min-height: 0; touch-action: pan-x pan-y;
    }

    #phone-container {
      width: 100vw;
      height: 100%; height: 100dvh; max-height: 100%;
      background: #000; border: 0; border-radius: 0;
      display: flex; flex-direction: column; overflow: hidden; position: relative;
      box-shadow: none; flex: 0 0 auto; contain: layout paint;
    }

    @media (min-width: 500px) and (min-height: 700px) {
      body { align-items: center; }
      #phone-container {
        width: min(430px, 100vw); height: min(850px, 100%); max-height: 850px;
        border: 12px solid #333; border-radius: 36px;
        box-shadow: 0 0 20px rgba(0,0,0,0.8);
      }
    }

    #status-bar {
      height: 24px; background: #222; color: #fff; font-size: 11px; display: flex;
      justify-content: space-between; align-items: center; padding: 0 12px; flex-shrink: 0; z-index: 10;
    }

    #screen-area { flex: 1; min-height: 0; position: relative; overflow: hidden; overscroll-behavior: contain; background: #181a1f; display: flex; flex-direction: column; }
    #home-screen, .app-view, #chat-bubbles, #contacts-list, #calllog-list, #memo-list, #calendar-list { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

    #lock-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20,20,20,0.95);
      z-index: 20; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px;
      transition: none;
      touch-action: manipulation;
    }
    #lock-clock { font-size: 48px; color: #fff; font-weight: bold; }
    #lock-date { font-size: 14px; color: #aaa; margin-top: 5px; }
    #lock-slide-text { font-size: 13px; color: #666; animation: blink 1.5s infinite; cursor: pointer; }
    @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

    #home-screen { padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-content: start; height: 100%; overflow-y: auto; }
    .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; text-align: center; }
    .app-icon div.icon-box { width: 56px; height: 56px; background: #333; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #fff; margin-bottom: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .app-icon span { font-size: 11px; color: #ccc; }

    .app-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #181a1f; display: none; flex-direction: column; z-index: 5; }
    .app-header { height: 44px; background: #222; color: #fff; display: flex; align-items: center; padding: 0 15px; font-size: 15px; font-weight: bold; gap: 10px; border-bottom: 1px solid #333; }
    .back-arrow { cursor: pointer; font-size: 18px; }

    #nav-bar { height: 48px; background: #222; display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; z-index: 10; border-top: 1px solid #333; }
    .nav-btn { color: #888; font-size: 18px; cursor: pointer; background: none; border: none; }
    .nav-btn:active { color: #fff; }


    /* TouchWiz / early Galaxy-inspired visual redesign */
    :root { color-scheme: dark; }
    * { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; }
    html, body { background:#101114; overflow:hidden !important; overscroll-behavior:none; }
    body { align-items:stretch; touch-action:pan-x pan-y; }
    #phone-container { background:#050607; }
    #status-bar { height:22px; min-height:22px; padding:0 9px; background:#17181b; color:#f4f4f4; font-size:10px; border-bottom:1px solid #303136; }
    #status-bar span:last-child { opacity:.88; font-size:9px; }
    #screen-area { background:#050608; }
    #home-screen {
      background:
        radial-gradient(ellipse at 12% 18%,rgba(119,222,255,.95) 0,rgba(40,151,245,.55) 18%,transparent 43%),
        radial-gradient(ellipse at 88% 12%,rgba(102,202,255,.95) 0,rgba(19,117,225,.55) 25%,transparent 48%),
        linear-gradient(135deg,#70d7ff 0%,#168ee8 30%,#0870d3 62%,#034aaf 100%);
      background-size:cover; padding:24px 18px 18px; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px 12px; align-content:start; overflow:hidden !important;
      position:relative;
    }
    #home-screen:before { content:""; position:absolute; inset:-20%; pointer-events:none; background:repeating-linear-gradient(128deg,transparent 0 38px,rgba(255,255,255,.12) 40px 48px,transparent 52px 83px); transform:skewY(-8deg); }
    .app-icon { position:relative; z-index:1; gap:0; }
    .app-icon div.icon-box { width:43px; height:43px; border-radius:9px; border:1px solid rgba(255,255,255,.7); box-shadow:0 2px 4px #003d7b99,inset 0 1px 2px #ffffffa8; font-size:22px; margin-bottom:5px; }
    .app-icon span { color:#fff; text-shadow:0 1px 2px #003d75; font-size:10px; }
    .app-icon:nth-child(1) .icon-box { background:linear-gradient(#b8e6ff,#138bdc)!important; }
    .app-icon:nth-child(2) .icon-box { background:linear-gradient(#fff,#c8e7fb)!important; }
    .app-icon:nth-child(3) .icon-box { background:linear-gradient(#fff6a8,#f4bd26)!important; }
    .app-icon:nth-child(4) .icon-box { background:linear-gradient(#fff6b3,#e9b921)!important; }
    .app-icon:nth-child(5) .icon-box { background:linear-gradient(#fff,#d8e1ec)!important; }
    .app-view { background:#000; color:#e7e7e7; }
    .app-header { min-height:38px; height:38px; background:linear-gradient(#35373b,#111214 55%,#24262a); border-bottom:1px solid #55585c; padding:0 10px; font-size:13px; box-shadow:inset 0 1px #777; }
    .back-arrow { color:#bbb; font-size:15px; }
    #nav-bar { height:34px; min-height:34px; background:linear-gradient(#202125,#090a0c); border-top:1px solid #414348; justify-content:space-around; }
    .nav-btn { color:#a7abb1; width:54px; height:30px; font-size:18px; text-shadow:0 1px #000; }
    #lock-screen { background:
      radial-gradient(ellipse at 15% 25%,rgba(126,224,255,.95),transparent 35%),
      radial-gradient(ellipse at 80% 10%,rgba(77,185,255,.8),transparent 35%),
      linear-gradient(135deg,#58c6ff,#0876d8 55%,#034ca9); padding:34px 18px 38px; }
    #lock-screen:before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(130deg,transparent 0 34px,rgba(255,255,255,.13) 37px 44px,transparent 48px 78px); pointer-events:none; }
    #lock-screen > div { position:relative; z-index:1; }
    #lock-clock { font-size:42px; font-weight:300; text-shadow:0 1px 3px #064a8a; }
    #lock-date { color:#e4f5ff; font-size:11px; }
    #lock-slide-text { color:#eaf8ff; font-size:10px; text-shadow:0 1px 2px #03437d; }
    #app-chatRoom #chat-bubbles { background:linear-gradient(#090a0b,#17191b)!important; padding:10px!important; gap:6px!important; }
    #chat-bubbles > div[style*="border-radius"] { border-radius:5px!important; box-shadow:0 1px 2px #0008; }
    #app-chatRoom input { border-radius:2px!important; background:#fff!important; color:#222!important; border:1px solid #aaa!important; min-width:0; }
    #app-chatRoom button { border-radius:2px!important; background:linear-gradient(#fff,#c7c7c7)!important; color:#222!important; border:1px solid #888!important; }
    #contacts-list, #calllog-list, #memo-list, #calendar-list, #msg-room-list-container { background:#000; }
    #contacts-list > div, #calllog-list > div:not(:first-child) { background:linear-gradient(#17181a,#030304)!important; border-bottom:1px solid #303135!important; }
    #contacts-list > div { min-height:51px; padding:10px 10px 8px 45px!important; position:relative; }
    #contacts-list > div:before { content:"👤"; position:absolute; left:9px; top:10px; width:28px; height:28px; border-radius:3px; background:linear-gradient(#dce5ed,#687582); display:grid; place-items:center; font-size:16px; }
    #contacts-list > div div:first-child { color:#f0f0f0!important; font-size:12px!important; }
    #contacts-list > div div:last-child { color:#a7a7a7!important; font-size:10px!important; }
    #calllog-list > div:first-child { background:linear-gradient(#65676b,#34363a)!important; color:#fff!important; }
    #calllog-list > div:not(:first-child) { padding:9px 10px!important; }
    #calllog-list > div:not(:first-child) > div:first-child:before { content:"⌄"; color:#d94c4c; font-size:17px; margin-right:8px; }
    #memo-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-content:start; gap:7px; padding:8px!important; }
    #memo-list > div { min-width:0; min-height:88px; padding:9px!important; color:#3c3517!important; background:linear-gradient(135deg,#fff7a0,#f4d94c)!important; border:1px solid #c8b23b; border-radius:2px; box-shadow:0 1px 3px #0009; overflow-wrap:anywhere; }
    #memo-list > div div:first-child { color:#807333!important; font-size:8px!important; }
    #memo-list > div div:last-child { color:#3f391b!important; font-size:10px!important; line-height:1.45!important; }
    #calendar-list > div { background:linear-gradient(#17181a,#030304)!important; border-bottom:1px solid #343538!important; padding:10px!important; }
    #calendar-list > div div:first-child { color:#8bbcf1!important; }
    #msg-room-list-container > div { background:linear-gradient(#191a1c,#050506)!important; border-bottom:1px solid #333!important; }
    #msg-room-list-container > div > div:first-child { border-radius:3px!important; border:1px solid #777; }
    #msg-room-list-container > div span { color:#eee!important; }
    #msg-room-list-container > div div[style*="font-size:11px"] { color:#aaa!important; }
    /* The outer display stays fixed; only app contents with long lists may scroll. */
    html, body, #phone-container, #screen-area { overscroll-behavior:none; }
    #home-screen { touch-action:manipulation; }
    #chat-bubbles, #contacts-list, #calllog-list, #memo-list, #calendar-list, #msg-room-list-container { overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; min-height:0; }
    @media (min-width:500px) and (min-height:700px) { #phone-container { border:10px solid #292a2d; border-radius:26px; } }


    /* Reference-matched full-screen proportions and large Galaxy hardware keys */
    #phone-container { width:100vw!important; max-width:none!important; height:100dvh!important; max-height:none!important; border:0!important; border-radius:0!important; }
    #status-bar { height:30px; min-height:30px; padding:0 14px; font-size:14px; }
    #status-bar span:last-child { font-size:12px; }
    #screen-area { flex:1; min-height:0; }
    #nav-bar { height:100px!important; min-height:100px!important; flex:0 0 100px; padding:0 7%; display:grid; grid-template-columns:1fr 1.5fr 1fr; align-items:center; justify-items:center; background:linear-gradient(110deg,#08090b,#1a1b1f 50%,#08090b)!important; border-top:2px solid #33363b!important; }
    .nav-btn { display:flex; align-items:center; justify-content:center; width:100%; height:100%; background:none!important; border:0; color:#aeb4bd; }
    .nav-menu .menu-glyph { display:block; width:34px; height:24px; border:3px solid #9ba1aa; border-radius:3px; font-size:0; position:relative; }
    .nav-menu .menu-glyph:before,.nav-menu .menu-glyph:after { content:""; position:absolute; left:4px; right:4px; height:2px; background:#9ba1aa; }
    .nav-menu .menu-glyph:before { top:5px; } .nav-menu .menu-glyph:after { bottom:5px; }
    .nav-home .home-glyph { width:138px; max-width:90%; height:58px; border:3px solid #45484e; border-radius:24px; background:linear-gradient(#303237,#111215 60%,#24262a); box-shadow:inset 0 2px 3px #666,0 1px 2px #000; display:flex; align-items:center; justify-content:center; }
    .nav-home .home-glyph:after { content:""; width:47px; height:14px; border:3px solid #696e76; border-radius:5px; box-shadow:inset 0 1px 2px #000; }
    .nav-back .back-glyph { font-size:48px; font-weight:300; line-height:1; transform:rotate(0deg); }
    /* Larger type and touch targets, similar to the reference screenshot */
    .app-header { height:50px; min-height:50px; font-size:17px; padding:0 14px; }
    .back-arrow { font-size:22px; }
    .app-icon div.icon-box { width:54px; height:54px; font-size:26px; }
    .app-icon span { font-size:13px; }
    #lock-screen { padding:5vh 6vw 6vh; }
    #lock-clock { font-size:clamp(56px, 11vw, 82px); }
    #lock-date { font-size:clamp(16px, 3.5vw, 22px); margin-top:10px; }
    #lock-slide-text { font-size:clamp(16px, 3.3vw, 22px); }
    #home-screen { padding:28px 24px; gap:30px 18px; }
    #contacts-list > div div:first-child { font-size:16px!important; }
    #contacts-list > div div:last-child { font-size:13px!important; }
    #contacts-list > div { min-height:66px; padding:12px 12px 10px 54px!important; }
    #contacts-list > div:before { width:34px; height:34px; font-size:19px; }
    #calllog-list > div:not(:first-child) { padding:13px!important; font-size:15px; }
    #memo-list > div { min-height:120px; padding:12px!important; }
    #memo-list > div div:first-child { font-size:11px!important; }
    #memo-list > div div:last-child { font-size:14px!important; line-height:1.5!important; }
    #app-chatRoom input { font-size:16px!important; padding:10px!important; }
    #app-chatRoom button { font-size:15px!important; padding:8px 14px!important; }
    #chat-bubbles > div[style*="border-radius"] { font-size:15px!important; line-height:1.5!important; }
    @media (min-width:500px) and (min-height:700px) { body { align-items:stretch!important; } #phone-container { width:min(520px,100vw)!important; height:100dvh!important; } }

  </style>
</head>
<body>

  <div id="phone-container">
    <div id="status-bar">
      <span id="status-clock">오전 12:00</span>
      <span>2009년 2월 15일 일요일</span>
    </div>

    <div id="screen-area">
      <!-- 잠금 화면 -->
      <div id="lock-screen" onclick="unlockPhone()">
        <div style="text-align:center;">
          <div id="lock-clock">12:00</div>
          <div id="lock-date">2월 15일 일요일</div>
        </div>
        <div id="lock-slide-text">▲ 위로 밀어서 잠금 해제</div>
      </div>

      <!-- 홈 화면 -->
      <div id="home-screen">
        <div class="app-icon" onclick="openApp('messages')">
          <div class="icon-box" style="background:#1e88e5;">✉️</div>
          <span>메시지</span>
        </div>
        <div class="app-icon" onclick="openApp('contacts')">
          <div class="icon-box" style="background:#fb8c00;">👤</div>
          <span>연락처</span>
        </div>
        <div class="app-icon" onclick="openApp('callLog')">
          <div class="icon-box" style="background:#43a047;">📞</div>
          <span>통화기록</span>
        </div>
        <div class="app-icon" onclick="openApp('memo')">
          <div class="icon-box" style="background:#fbc02d;">📝</div>
          <span>메모</span>
        </div>
        <div class="app-icon" onclick="openApp('calendar')">
          <div class="icon-box" style="background:#e53935;">📅</div>
          <span>캘린더</span>
        </div>
      </div>

      <!-- 메시지 목록 앱 뷰 -->
      <div id="app-messages" class="app-view"></div>

      <!-- 개별 채팅방 뷰 -->
      <div id="app-chatRoom" class="app-view">
        <div class="app-header">
          <span class="back-arrow" onclick="openApp('messages')">◀</span>
          <span id="chat-room-title">채팅방</span>
        </div>
        <div id="chat-bubbles" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:8px; background:#121212;"></div>
        <div style="padding:10px; background:#222; display:flex; gap:8px;">
          <input type="text" id="chat-input-text" placeholder="메시지 입력..." style="flex:1; padding:8px; border-radius:4px; border:1px solid #444; background:#111; color:#fff; font-size:12px;" onkeypress="if(event.key==='Enter') sendMsg(currentChatRoom)">
          <button onclick="sendMsg(currentChatRoom)" style="padding:0 12px; background:#527da8; color:#fff; border:none; border-radius:4px; font-size:12px; cursor:pointer;">전송</button>
        </div>
      </div>

      <!-- 연락처 앱 뷰 -->
      <div id="app-contacts" class="app-view">
        <div class="app-header"><span class="back-arrow" onclick="goBack()">◀</span> 연락처</div>
        <div id="contacts-list" style="flex:1; overflow-y:auto; padding:10px;"></div>
      </div>

      <!-- 통화기록 앱 뷰 -->
      <div id="app-callLog" class="app-view">
        <div class="app-header"><span class="back-arrow" onclick="goBack()">◀</span> 통화기록</div>
        <div id="calllog-list" style="flex:1; overflow-y:auto; padding:10px;"></div>
      </div>

      <!-- 메모 앱 뷰 -->
      <div id="app-memo" class="app-view">
        <div class="app-header"><span class="back-arrow" onclick="goBack()">◀</span> 메모</div>
        <div id="memo-list" style="flex:1; overflow-y:auto; padding:10px;"></div>
      </div>

      <!-- 캘린더 앱 뷰 -->
      <div id="app-calendar" class="app-view">
        <div class="app-header"><span class="back-arrow" onclick="goBack()">◀</span> 캘린더</div>
        <div id="calendar-list" style="flex:1; overflow-y:auto; padding:10px;"></div>
      </div>
    </div>

    <div id="nav-bar">
      <button class="nav-btn nav-menu" aria-label="목록" onclick="showAppMenu()"><span class="menu-glyph">☰</span></button>
      <button class="nav-btn nav-home" aria-label="홈" onclick="goHome()"><span class="home-glyph"></span></button>
      <button class="nav-btn nav-back" aria-label="실행 취소" onclick="goBack()"><span class="back-glyph">↶</span></button>
    </div>
  </div>

  <script>
    function $(id) { return document.getElementById(id); }
    function showAppMenu() {
      const visible = document.querySelector('.app-view[style*="display: flex"], .app-view[style*="display: block"]');
      if (visible) goBack(); else goHome();
    }
    function goHome() {
      document.querySelectorAll('.app-view').forEach(v => v.style.display = 'none');
      const home = $('home-screen'); if (home) home.style.display = 'grid';
      const lock = $('lock-screen'); if (lock) lock.style.display = 'none';
    }


    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      let m = String(now.getMinutes()).padStart(2, '0');
      let ampm = h >= 12 ? '오후' : '오전';
      let h12 = h % 12 || 12;

      const timeStr = ampm + " " + String(h12).padStart(2, '0') + ":" + m;
      const lockTimeStr = String(h12).padStart(2, '0') + ":" + m;

      if($('status-clock')) $('status-clock').textContent = timeStr;
      if($('lock-clock')) $('lock-clock').textContent = lockTimeStr;
    }
    updateClock();
    setInterval(updateClock, 15000);

    function unlockPhone() {
      const lockScreen = $('lock-screen');
      if (lockScreen) {
        lockScreen.style.display = 'none';
        lockScreen.style.pointerEvents = 'none';
      }
    }

    let currentApp = 'home';
    let currentChatRoom = '';

    function openApp(appName, param) {
      currentApp = appName;
      document.querySelectorAll('.app-view').forEach(v => v.style.display = 'none');
      $('home-screen').style.display = 'none';

      if(appName === 'home') {
        $('home-screen').style.display = 'grid';
      } else if(appName === 'messages') {
        $('app-messages').style.display = 'flex';
        renderMessagesApp($('app-messages'));
      } else if(appName === 'chatRoom') {
        currentChatRoom = param;
        $('app-chatRoom').style.display = 'flex';
        $('chat-room-title').textContent = param;
        loadChatBubbles(param);
      } else if(appName === 'contacts') {
        $('app-contacts').style.display = 'flex';
        renderContactsApp();
      } else if(appName === 'callLog') {
        $('app-callLog').style.display = 'flex';
        renderCallLogApp();
      } else if(appName === 'memo') {
        $('app-memo').style.display = 'flex';
        renderMemoApp();
      } else if(appName === 'calendar') {
        $('app-calendar').style.display = 'flex';
        renderCalendarApp();
      } else {
        const target = $('app-' + appName);
        if(target) target.style.display = 'flex';
      }
    }

    function goBack() {
      if(currentApp === 'chatRoom') {
        openApp('messages');
      } else {
        openApp('home');
      }
    }

    // --- 원본 데이터 모듈 ---
    const contactsData = [
      {name: "강예린", phone: "110-2841-6392"}, {name: "김민서", phone: "110-5730-1826"},
      {name: "류해온", phone: "110-4196-7253"}, {name: "박승윤", phone: "110-8263-4107"},
      {name: "아빠", phone: "110-1957-3842"}, {name: "엄마", phone: "110-6428-9513"},
      {name: "윤지호", phone: "110-3075-8264"}, {name: "이도현", phone: "110-9182-5730"},
      {name: "이유림", phone: "110-4619-2085"}, {name: "정다은", phone: "110-7352-6941"},
      {name: "차지우", phone: "110-5824-1376"}, {name: "최서윤", phone: "110-2496-8135"},
      {name: "한유진", phone: "110-6741-5298"}
    ];

    const favoritesList = ["류해온", "아빠", "엄마"];

    const callsData = [
      {date: "2009.09.20", logs: [

    // --- 메시지 관련 로직 ---
    function formatTimeToAMPM(timeStr) {
      if (!timeStr) return "";
      if (timeStr.includes('오전') || timeStr.includes('오후')) return timeStr;
      let parts = timeStr.split(':');
      if (parts.length < 2) return timeStr;
      let hour = parseInt(parts[0], 10);
      let minute = parts[1];
      let ampm = hour >= 12 ? '오후' : '오전';
      hour = hour % 12 || 12;
      return ampm + " " + String(hour).padStart(2, '0') + ":" + minute;
    }

    function loadChatBubbles(roomName) {
      const bubbles = $('chat-bubbles');
      bubbles.innerHTML = "";
      const sections = chatRooms[roomName];
      if (!sections) return;

      sections.forEach(sec => {
        const divDate = document.createElement('div');
        divDate.style.cssText = "text-align:center; font-size:10px; color:#666; margin:10px 0 4px; font-weight:bold;";
        divDate.textContent = sec.date;
        bubbles.appendChild(divDate);

        sec.msgs.forEach(m => {
          const bubble = document.createElement('div');
          const isMe = m.from === 'me';
          const formattedTime = formatTimeToAMPM(m.time);
          bubble.style.cssText = "max-width:80%; padding:8px 12px; border-radius:12px; font-size:12px; line-height:1.4; word-break:break-all; display:flex; flex-direction:column;" +
            (isMe ? "align-self:flex-end; background:#d6f4a7; border:1px solid #95cb53;" : "align-self:flex-start; background:#fff; border:1px solid #ccc; color:#111;");
          bubble.innerHTML = `<span>${m.text}</span><span style="font-size:9px; color:#666; margin-top:2px; align-self:${isMe ? 'flex-end' : 'flex-start'};">${formattedTime}</span>`;
          bubbles.appendChild(bubble);
        });
      });
      bubbles.scrollTop = bubbles.scrollHeight;
    }

    function sendMsg(roomName) {
      const input = $('chat-input-text');
      const txt = input.value.trim();
      if (!txt) return;

      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? '오후' : '오전';
      hours = hours % 12 || 12;
      const timeStr = ampm + " " + String(hours).padStart(2, '0') + ":" + minutes;

      const todayStr = "2009년 09월 20일 일요일";
      let targetSec = chatRooms[roomName].find(s => s.date === todayStr);
      if (!targetSec) {
        targetSec = {date: todayStr, msgs: []};
        chatRooms[roomName].push(targetSec);
      }

      targetSec.msgs.push({from: 'me', time: timeStr, text: txt});
      input.value = "";
      loadChatBubbles(roomName);
    }
